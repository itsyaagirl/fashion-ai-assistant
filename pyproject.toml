[project]
name = "fashion-assistant"
version = "1.0.0"
description = "Multimodal LangGraph agent + RAG that recommends accessories from outfit photos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
